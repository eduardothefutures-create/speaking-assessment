'+(i+1),goal:''})),criteria:criteriaDefault.map((name,i)=>({id:uid(),name,desc:[...descs[i]]})),records:{},finals:{},tags:{positive:[...positive],negative:[...negative]},exports:{},ai:null,edited:{},revision:0,created:Date.now()}}function save(){if(!s)return;let i=db.findIndex(x=>x.id===s.id);if(i<0)db.push(s);else db[i]=s;try{localStorage.setItem(key,JSON.stringify(db));$('saveStatus').textContent='✓ All changes saved'}catch(e){$('saveStatus').textContent='Save failed — export backup';console.error(e)}}function change(){s.revision++;s.finals={};save()}function confirmAction(t){return confirm(t)}function unit(){return s.units[unitIndex]}function task(){return s.tasks[taskIndex]}function students(){return s.units.flatMap(u=>u.students)}function record(st,ta){let k=st.id+'|'+ta.id;return s.records[k]||(s.records[k]={ratings:{},strengths:'',errors:'',notes:'',tags:[]})}function complete(st){return s.tasks.every(t=>s.criteria.every(c=>!!record(st,t).ratings[c.id]))}function unitComplete(u){return u.students.every(complete)}function status(u){return unitComplete(u)?'Completed':u.students.some(st=>s.tasks.some(t=>{let r=record(st,t);return Object.keys(r.ratings).length||r.notes||r.errors||r.strengths||r.tags.length}))?'In progress':'Pending'}function syncUnits(){let old=s.units||[],next=[];for(let [kind,n,size] of [['Pair',s.pairs,2],['Trio',s.trios,3]])for(let i=0;i<n;i++){let name=kind+' '+(i+1),u=old.find(x=>x.kind===kind&&x.number===i+1);next.push(u||{id:uid(),kind,number:i+1,name,students:Array.from({length:size},()=>({id:uid(),name:''})),timer:{elapsed:0,start:null,finished:false}})}s.units=next}function setup(){view='setup';if(!s){s=fresh();syncUnits()}app.innerHTML=`<div class="row spread"><div><h1>Assessment setup</h1><p class="muted">Configure todo o grupo antes de iniciar a prova oral.</p></div><button onclick="historyView()">Previous sessions</button></div><div class="card"><h2>Teacher & group</h2><div class="grid">${[['teacher','Teacher name'],['group','Group ninput="s.criteria[${i}].name=this.value;save()">${['A','PA','NA'].map((r,j)=>`<label>${labels[r]}</label><textarea oninput="s.criteria[${i}].desc[${j}]=this.value;save()">${esc(c.desc[j])}</textarea>`).join('')}</details>`).join('')}<p class="muted">Pronunciation: prioritize intelligibility, not a native accent.</p></div><div class="card"><h2>Reusable templates</h2><div class="row"><button onclick="templateSave()">Save template</button><button onclick="templateLoad()">Load template</button></div></div><button class="primary" onclick="start()">START ASSESSMENT →</button>`;renderUnits()}function renderUnits(){let n=s.pairs*2+s.trios*3;$('validation').innerHTML=n===s.total?'<span class="A">✓ Configuration matches student total.</span>':`<span class="NA">${n} seats for ${s.total} students. Adjust by ${Math.abs(n-s.total)} seats.</span>`;$('unitCards').innerHTML=s.units.map((u,i)=>`<div class="card" style="margin-top:12px"><div class="row spread"><h3>${esc(u.name)}</h3><div><button onclick="reorder(${i},-1)">↑</button><button onclick="reorder(${i},1)">↓</button></div></div>${u.students.map((st,j)=>`<label>Student ${j+1}</label><input value="${esc(st.name)}" placeholder="Full name" oninput="s.units[${i}].students[${j}].name=this.value;save()">`).join('')}</div>`).join('')}function setCount(k,v){let n=Math.max(k==='total'?2:0,Math.min(200,Math.floor(Number(v)||0)));if(k!=='total'&&Object.keys(s.records).length&& !confirm('Changing unit configuration may remove students from the active session. Existing records are retained. Continue?'))return setup();s[k]=n;if(k!=='total')syncUnits();save();setup()}function setTasks(v){let n=Math.max(1,Math.min(8,Math.floor(Number(v)||1)));if(n<s.tasks.length&&Object.keys(s.records).length&&!confirm('Remove tasks from active assessment? Existing records are retained.'))return setup();while(s.tasks.length<n)s.tasks.push({id:uid(),name:'Task '+(s.tasks.length+1),goal:''});s.tasks.length=n;change();setup()}function bulkImport(shuffle){let a= function elapsed(u){return u.timer.elapsed+(u.timer.start?Date.now()-u.timer.start:0)}function clock(ms){return new Date(Math.max(0,ms)).toISOString().slice(11,19)}function timerAction(a){let t=unit().timer;if(a==='start'){t.start=Date.now();t.finished=false}else if(a==='pause'||a==='finish'){if(t.start)t.elapsed+=Date.now()-t.start;t.start=null;t.finished=a==='finish'}else if(a==='reset'){if(!confirm('Reset this timer?'))return;Object.assign(t,{elapsed:0,start:null,finished:false})}save();assessment()}setInterval(()=>{if(view==='assessment'&&s&&$('timer'))$('timer').textContent=clock(elapsed(unit()));if($('recTime')&&recording)$('recTime').textContent=clock(Date.now()-recording.started)},250);
const guideOpen=new Set();function guideKey(){return s.id+':'+unit().id+':'+task().id}function guideToggle(el){if(el.open)guideOpen.add(guideKey());else guideOpen.delete(guideKey())}function guideContent(raw){const re=/(?:^|\s)(?:\*\*)?(Communicative objective|Task instructions|Expected language(?: use)?|Expected communicative performance|What to assess|Assessment focus|Qualitative task achievement|Task achievement)(?:\*\*)?\s*:\s*(?:\*\*)?/gi;let matches=[...raw.matchAll(re)];if(!matches.length)return `<section class="guide-section"><div>${esc(raw)}</div></section>`;let out='',prefix=raw.slice(0,matches[0].index).trim();if(prefix)out+=`<section class="guide-section"><div>${esc(prefix)}</div></section>`;matches.forEach((m,i)=>{let body=raw.slice(m.index+m[0].length,matches[i+1]?.index??raw.length).trim();if(/achievement/i.test(m[1]))body=body.replace(/\s+(?=(?:Atendido|Parcialmente Atendido|Não Atendido)\s*\((?:A|PA|NA)\)|(?:A|PA|NA)\s*[—–:-])/gi,'\n');out+=`<section class="guide-section"><h3>${esc(m[1])}</h3><div>${esc(body)}</div></section>`});return out}function taskGuide(t){return `<details class="task-guide" id="taskGuide" ${guideOpen.has(guideKey())?'open':''} ontoggle="guideToggle(this)"><summary><span aria-hidden="true">☷</span><span><b>Task assessment guide</b><small>${esc(t.name)} · Click to show or hide objectives and criteria</small></span><span class="guide-arrow" aria-hidden="true">⌄</span></summary><div class="guide-body">${guideContent(t.goal)}<button onclick="document.getElementById('taskGuide').open=false">Hide assessment guide</button></div></details>`}
function assessment(){view='assessment';let u=unit(),t=task();app.innerHTML=`<div class="sticky"><div class="row spread"><div><h1>${esc(s.group)}</h1><small>${esc(s.teacher)} · ${esc(s.date)} · ${students().filter(complete).length} of ${students().length} students assessed · ${s.units.filter(unitComplete).length} of ${s.units.length} units complete</small></div><div class="row"><button onclick="leave(setup)">Edit setup</button><button onclick="leave(review)">Final review</button><button onclick="audioLibrary()">Audio library</button></div></div><div class="card" style="margin:8px 0;padding:10px"><div class="row">${s.units.map((x,i)=>`<button class="${i===unitIndex?'active':''}" onclick="goUnit(${i})">${esc(x.name)} · ${status(x)}</button>`).join('')}</div><hr style="border:0;border-top:1px solid var(--line)"><div class="row spread"><div class="row"><span class="timer" id="timer">${clock(elapsed(u))}</span><button onclick="timerAction('${u.timer.start?'pause':'start'}')">${u.timer.start?'Pause':u.timer.elapsed?'Resume':'Start timer'}</button><button onclick="timerAction('finish')">Finish</button><button onclick="timerAction('reset')">Reset</button></div><div class="row"><button onclick="testMic()">Test mic</button>${recording?`<span class="rec">● REC <span id="recTime"></span></span><button onclick="pauseRec()">${recorder?.state==='paused'?'Resume':'Pause'}</button><button onclick="stopRec()">Stop & save</button><button onclick="bookmark()">Bookmark</button>`:`<button onclick="startRec()">● Start recording</button>`}</div></div><div class="row" style="margin-top:8px">${s.tasks.map((x,i)=>`<button class="${i===taskIndex?'active':''}" onclick="goTask(${i})">${esc(x.name)} ${u.students.every(st=>s.criteria.every(c=>record(st,x).ratings[c.id]))?'✓':''}</button>`).join('')}</div></div><div class="row"><span class="pill A">A · Atendido</span><span class="pill PA">PA · Parcialmente Atendido</span><span class="pill NA">NA · Não Atendido</span><button class="tag" onclick="undoLast()">Undo last rating</button></div></div>${t.goal?taskGuide(t):''}<div class="cols" style="--student-count:${u.students.length};grid-template-columns:repeat(${u.students.length},minmax(245px,1fr))">${u.students.map((st,j)=>studentPanel(st,j)).join('')}</div><div class="row spread"><button onclick="goTask(${taskIndex-1})">← Previous task</button><button onclick="goTask(${taskIndex+1})">Next task →</button><button class="primary" onclick="finishUnit()">Complete ${esc(u.kind)}</button><button onclick="goUnit(${unitIndex+1})">Save & next unit →</button></div>`}function studentPanel(st,j){let r=record(st,task());return `<section class="card student"><h2>${esc(st.name)}</h2>${s.criteria.map((c,i)=>`<div class="criterion"><div class="row spread"><b>${esc(c.name)}</b><button class="tag" onclick="rubric(${i})">?</button></div><div class="rating">${Object.keys(labels).map(v=>`<button class="${v} ${r.ratings[c.id]===v?'selected':''}" title="${labels[v]}" onclick="rate(${j},${i},'${v}')">${v}</button>`).join('')}</div></div>`).join('')}${[['strengths','Strengths'],['errors','Errors / areas for improvement'],['notes','Additional notes']].map(([k,l])=>`<label>${l}</label><textarea oninput="note(${j},'${k}',this.value)">${esc(r[k])}</textarea>${k==='notes'?'':`<div class="row">${s.tags[k==='strengths'?'positive':'negative'].map((tag,i)=>`<button class="tag" onclick="addTag(${j},'${k}',${i})">+ ${esc(tag)}</button>`).join('')}</div>`}`).join('')}<button class="tag" onclick="editTags()">Customize tags</button></section>`}function rubric(i){let c=s.criteria[i];modal(`<h2>${esc(c.name)}</h2>${Object.keys(labels).map((k,j)=>`<h3>${labels[k]}</h3><p>${esc(c.desc[j]||'Not defined')}</p>`).join('')}`)}function rate(j,i,v){let st=unit().students[j],r=record(st,task()),k=s.criteria[i].id;undo.push({r,k,old:r.ratings[k]});if(r.ratings[k]===v)delete r.ratings[k];else r.ratings[k]=v;change();assessment()}function undoLast(){let x=undo.pop();if(!x)return;if(x.old)x.r.ratings[x.k]=x.old;else delete x.r.ratings[x.k];change();assessment()}function note(j,k,v){record(unit().students[j],task())[k]=v;s.revision++;save()}function addTag(j,k,i){let r=record(unit().students[j],task()),tag=s.tags[k==='strengths'?'positive':'negative'][i];r[k]+=(r[k]?'\n':'')+tag;r.tags.push(tag);s.revision++;save();assessment()}function editTags(){modal(`<h2>Feedback tags</h2><label>Strengths (one per line)</label><textarea id="pos">${esc(s.tags.positive.join('\n'))}</textarea><label>Areas to develop</label><textarea id="neg">${esc(s.tags.negative.join('\n'))}</textarea><button onclick="s.tags={positive:$('pos').value.split('\\n').filter(Boolean),negative:$('neg').value.split('\\n').filter(Boolean)};save();$('modal').close();assessment()">Save tags</button>`)}function goTask(i){if(i<0||i>=s.tasks.length)return;taskIndex=i;unit().lastTask=i;save();assessment()}async function leave(fn){if(recording){if(!confirm('Stop and save recording before leaving?'))return;await stopRec(false)}if(view==='assessment'&&unit()?.timer.start){if(!confirm('Pause current timer before leaving?'))return;let t=unit().timer;t.elapsed+=Date.now()-t.start;t.start=null;save()}fn()}function goUnit(i){if(i<0||i>=s.units.length||i===unitIndex)return;leave(()=>{unitIndex=i;taskIndex=Math.min(unit().lastTask||0,s.tasks.length-1);assessment()})}function finishUnit(){if(!unitComplete(unit()))return alert('Missing: '+missing(unit().students).join('; '));leave(()=>{unit().timer.finished=true;save();if(unitIndex+1<s.units.length)goUnit(unitIndex+1);else review()})}function missing(list=students()){return list.flatMap(st=>s.tasks.flatMap(t=>s.criteria.filter(c=>!record(st,t).ratings[c.id]).map(c=>st.name+' / '+t.name+' / '+c.name)))}
let idb;function openDB(){return idb||(idb=new Promise((resolve,reject)=>{let q=indexedDB.open('speaking-audio-v1',1);q.onupgradeneeded=()=>q.result.createObjectStore('audio',{keyPath:'id'});q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)}))}async function audioOp(mode,fn){let d=await openDB();return new Promise((resolve,reject)=>{let tx=d.transaction('audio',mode),q=fn(tx.objectStore('audio'));tx.oncomplete=()=>resolve(q.result);tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)})}async function mic(){if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)throw Error('Microphone recording unavailable. Use a compatible browser on HTTPS or localhost.');return navigator.mediaDevices.getUserMedia({audio:true})}async function testMic(){try{let m=await mic();m.getTracks().forEach(t=>t.stop());alert('Microphone access successful.')}catch(e){alert(e.message)}}async function startRec(){if(recording)return;if(!confirm('Confirm institutional authorization and required participant consent for local audio recording.'))return;try{stream=await mic();let types=['audio/webm;codecs=opus','audio/mp4','audio/webm'];let mime=types.find(x=>MediaRecorder.isTypeSupported(x));recorder=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);let meta={id:uid(),session:s.id,unit:unit().id,group:s.group,name:unit().name,students:unit().students.map(x=>x.name),date:s.date,started:Date.now(),bookmarks:[],chunks:[],active:0,resumed:Date.now()};recording=meta;recorder.ondataavailable=e=>{if(e.data.size)meta.chunks.push(e.data)};recorder.start(1000);assessment()}catch(e){stream?.getTracks().forEach(t=>t.stop());recording=null;alert('Recording unavailable: '+e.message)}}function pauseRec(){if(!recording)return;if(recorder.state==='recording'){recording.active+=Date.now()-recording.resumed;recorder.pause()}else if(recorder.state==='paused'){recording.resumed=Date.now();recorder.resume()}assessment()}function stopRec(render=true){return new Promise(resolve=>{if(!recording)return resolve();let m=recording,r=recorder;if(r.state==='recording')m.active+=Date.now()-m.resumed;r.onstop=async()=>{let blob=new Blob(m.chunks,{type:r.mimeType||m.chunks[0]?.type||'audio/webm'});let item={...m,blob,duration:m.active};delete item.chunks;stream?.getTracks().forEach(t=>t.stop());recording=null;try{await audioOp('readwrite',o=>o.put(item));alert('Audio saved locally. Download a backup from Audio library.')}catch(e){download(blob,audioName(item));alert('Local audio storage failed. A download was requested.')}if(render&&view==='assessment')assessment();resolve()};r.stop()})}function audioName(x){return `${x.group}_${x.name}_${x.date}_${x.id.slice(0,5)}.${x.blob.type.includes('mp4')?'m4a':'webm'}`.replace(/[^a-zA-Z0-9_.-]/g,'_')}function bookmark(){if(!recording)return;let n=prompt('Bookmark observation (optional):','');if(n===null)return;recording.bookmarks.push({time:(recording.active+(recorder.state==='recording'?Date.now()-recording.resumed:0))/1000,task:task().name,note:n});alert('Bookmark added.')}async function audioLibrary(){try{let all=(await audioOp('readonly',o=>o.getAll())).filter(x=>x.session===s.id);audioURLs.forEach(URL.revokeObjectURL);audioURLs=[];window.audioItems=all;modal(`<h2>Assessment audio library</h2><p class="muted">Local recordings. Download important files; browser storage may be cleared.</p>${all.length?all.map((x,i)=>{let url=URL.createObjectURL(x.blob);audioURLs.push(url);return `<div class="card"><b>${esc(x.name)} · ${esc(x.students.join(', '))}</b><p>${clock(x.duration)} · ${esc(x.date)}</p><audio id="audio${i}" controls src="${url}"></audio><div class="row"><button onclick="download(audioItems[${i}].blob,audioName(audioItems[${i}]))">Download</button><button onclick="deleteAudio(${i})">Delete</button><button onclick="addSavedBookmark(${i})">Bookmark playback</button></div>${x.bookmarks.map(b=>`<p><button onclick="$('audio${i}').currentTime=${Number(b.time)};$('audio${i}').play()">${clock(b.time*1000)}</button> ${esc(b.task)} · ${esc(b.note)}</p>`).join('')}</div>`}).join(''):'<p>No saved recordings.</p>'}`)}catch(e){alert('Audio library unavailable: '+e.message)}}async function deleteAudio(i){if(!confirm('Permanently delete recording?'))return;await audioOp('readwrite',o=>o.delete(audioItems[i].id));$('modal').close();audioLibrary()}async function addSavedBookmark(i){let x=audioItems[i],n=prompt('Bookmark note');if(n===null)return;x.bookmarks.push({time:$('audio'+i).currentTime,task:'',note:n});await audioOp('readwrite',o=>o.put(x));$('modal').close();audioLibrary()}window.addEventListener('beforeunload',e=>{if(recording){e.preventDefault();e.returnValue=''}});
function suggest(vals){if(vals.some(x=>!x)||vals.includes('A')&&vals.includes('NA'))return '';let a=Object.keys(labels).map(k=>[k,vals.filter(x=>x===k).length]).sort((x,y)=>y[1]-x[1]);return a[0][1]>a[1][1]?a[0][0]:''}function review(){view='review';let m=missing();app.innerHTML=`<h1>Final review</h1><div class="row"><button onclick="assessment()">Back to assessment</button><button onclick="historyView()">History</button></div>${m.length?`<div class="card notice"><b>Incomplete assessments</b><details><summary>Show missing fields (${m.length})</summary>${m.map(x=>`<p>${esc(x)}</p>`).join('')}</details></div>`:''}${students().map((st,i)=>`<div class="card"><h2>${esc(st.name)}</h2>${complete(st)?s.criteria.map(c=>{let vals=s.tasks.map(t=>record(st,t).ratings[c.id]);return `<div class="row spread"><b>${esc(c.name)}</b><span>${vals.join(' · ')}</span><select style="width:240px" onchange="setFinal(${i},'${c.id}',this.value)">${opts(s.finals[st.id]?.[c.id]||'',suggest(vals))}</select></div>`}).join('')+`<label>Official final qualitative result</label><select onchange="setFinal(${i},'overall',this.value)">${opts(s.finals[st.id]?.overall||'',suggest(s.tasks.map(t=>record(st,t).ratings[s.criteria.at(-1).id])))}</select><label>Teacher justification (optional)</label><textarea oninput="setFinal(${i},'justification',this.value)">${esc(s.finals[st.id]?.justification||'')}</textarea>`:'<p class="notice">Assessment incomplete — no official result.</p>'}</div>`).join('')}<div class="card"><h2>Reports</h2><p>Confirm all qualitative results before generating official reports.</p><div class="row"><button class="primary" onclick="openReports('standard')">Generate standard reports</button><button onclick="exportAI()">Export for AI analysis</button><button onclick="importAI()">Import AI reports</button>${s.ai?'<button onclick="openReports(\'ai\')">AI-enhanced reports</button>':''}</div></div>`}function opts(v,suggestion){return `<option value="">${suggestion?'Suggested: '+labels[suggestion]+' — confirm':'Teacher review required'}</option>`+Object.keys(labels).map(k=>`<option value="${k}" ${v===k?'selected':''}>${labels[k]}${suggestion===k?' (suggested)':''}</option>`).join('')}function setFinal(i,k,v){let st=students()[i];(s.finals[st.id]||={})[k]=v;s.revision++;save()}function ready(){if(missing().length)return alert('Complete all assessment fields first.'),false;if(students().some(st=>!s.finals[st.id]?.overall||s.criteria.some(c=>!s.finals[st.id]?.[c.id])))return alert('Confirm every final criterion and overall result first.'),false;return true}function label(v){return labels[v]||'Pendente'}function pill(v){return `<span class="pill ${esc(v||'')}">${esc(label(v))}</span>`}function matrix(st){return `<table><thead><tr><th>Aspecto</th>${s.tasks.map(t=>`<th>${esc(t.name)}</th>`).join('')}<th>Resultado final</th></tr></thead><tbody>${s.criteria.map(c=>`<tr><td>${esc(c.name)}</td>${s.tasks.map(t=>`<td>${esc(record(st,t).ratings[c.id]||'—')}</td>`).join('')}<td>${pill(s.finals[st.id]?.[c.id])}</td></tr>`).join('')}</tbody></table><small>A — Atendido · PA — Parcialmente Atendido · NA — Não Atendido</small>`}function listAspects(st,good){return s.criteria.slice(0,-1).filter(c=>good?s.finals[st.id]?.[c.id]==='A':['PA','NA'].includes(s.finals[st.id]?.[c.id])).map(c=>c.name)}const recommendations=['Praticar inteligibilidade por meio de atividades de percepção e produção oral.','Ampliar o vocabulário em situações comunicativas contextualizadas.','Praticar estruturas relevantes em atividades comunicativas.','Realizar conversas guiadas e espontâneas com apoio gradual.','Retomar os objetivos definidos na rubrica institucional.'];function localText(st){let good=listAspects(st,true),bad=listAspects(st,false);return `Pontos fortes: ${good.length?'Conceito Atendido em '+good.join(', ')+'.':'Não há aspectos consolidados como Atendido.'}\n\nAspectos a desenvolver: ${bad.length?bad.join(', ')+'.':'Não foram registrados aspectos consolidados como PA ou NA.'}\n\nRecomendações: ${s.criteria.slice(0,-1).map((c,i)=>bad.includes(c.name)?recommendations[i]:'').filter(Boolean).join(' ')||'Manter oportunidades de prática comunicativa.'}\n\nParecer final: O resultado qualitativo validado pelo professor foi ${label(s.finals[st.id].overall)}. A síntese considera os registros das atividades, sem inferir dificuldades específicas não documentadas.`}function groupText(){let lines=s.criteria.slice(0,-1).map((c,i)=>{let a=students().filter(st=>s.finals[st.id]?.[c.id]==='A'),b=students().filter(st=>['PA','NA'].includes(s.finals[st.id]?.[c.id]));return `${c.name}: ${a.length===students().length?'Desempenho consistentemente atendido.':b.length===students().length?'Necessidade de desenvolvimento observada no grupo.':a.length>1&&b.length>1?'Desempenho variável, com pontos fortes e necessidades recorrentes.':a.length>1?'Ponto forte recorrente; há necessidades individuais.':b.length>1?'Dificuldade recorrente; há desempenhos distintos.':'Evidências individuais.'} ${b.length?recommendations[i]:''}`});let tags={};students().forEach(st=>s.tasks.forEach(t=>record(st,t).tags.forEach(tag=>(tags[tag]||=new Set()).add(st.id))));return `Panorama qualitativo\n${lines.join('\n\n')}\n\nObservações recorrentes registradas por diferentes alunos: ${Object.entries(tags).filter(([k,v])=>v.size>1).map(([k])=>k).join('; ')||'Nenhuma categoria recorrente registrada por meio das etiquetas.'}\n\nPrioridades pedagógicas: revisar os aspectos com PA ou NA recorrentes e manter a prática dos pontos fortes. As recomendações são gerais e devem ser ajustadas pelo professor às evidências.`}function narrative(x){if(typeof x==='string')return x;if(Array.isArray(x))return x.map(narrative).join('\n');if(x&&typeof x==='object')return Object.entries(x).map(([k,v])=>k.replaceAll('_',' ')+': '+narrative(v)).join('\n\n');return ''}function openReports(mode){if(!ready())return;if(mode==='ai'&&(!s.ai||s.ai.revision!==s.revision))return alert('AI report is outdated or missing. Export the current records again.');reportMode=mode;view='reports';let items=students();app.innerHTML=`<div class="no-print row spread"><h1>${mode==='ai'?'AI-enhanced':'Standard'} reports</h1><div class="row"><button onclick="review()">Back</button><button onclick="openReports('standard')">Standard</button>${s.ai?'<button onclick="openReports(\'ai\')">AI-enhanced</button>':''}<button onclick="csv()">Export CSV</button><button onclick="exportAI()">AI analysis file</button><button onclick="importAI()">Import AI</button><button onclick="exportWord()">Download Word (.docx)</button><button class="primary" onclick="printReport()">Print / save PDF</button></div></div><div class="no-print card"><label>Report selection</label><select id="reportSelect" onchange="filterReports(this.value)"><option value="all">All student reports (no teacher report)</option><option value="everything">Students + teacher diagnostic</option><option value="group">Teacher diagnostic only</option>${items.map((st,i)=>`<option value="${i}">${esc(st.name)}</option>`).join('')}</select><p class="muted">Review and edit narratives before exporting. Each student starts on a separate A4 page. Long reports may need additional pages.</p></div><div class="report">${items.map((st,i)=>{let u=s.units.find(u=>u.students.includes(st)),ai=s.ai?.data?.individual_reports?.find(x=>x.student_id===s.ai.map[st.id]),text=mode==='ai'?narrative(ai?.report):localText(st);return `<article class="card report-page ${i===0?'first-visible':''}" data-report="${i}"><h2>RELATÓRIO INDIVIDUAL DE AVALIAÇÃO ORAL</h2><h1>${esc(st.name)}</h1><p>Professor: ${esc(s.teacher)} · Grupo: ${esc(s.group)} · ${esc(s.date)} · ${esc(u.name)}</p><h3>Resultado qualitativo final</h3>${pill(s.finals[st.id].overall)}<h3>Desempenho por aspecto avaliativo</h3>${matrix(st)}<h3>Evidências e observações do professor</h3>${s.tasks.map(t=>{let r=record(st,t);return r.strengths||r.errors||r.notes?`<div class="evidence"><p><b>${esc(t.name)}</b>${[['Pontos fortes',r.strengths],['Aspect
